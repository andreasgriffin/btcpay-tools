services:
  subscription-api:
    build:
      context: ../..
      dockerfile: btcpay_tools/btcpay_subscription_api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${BTCPAY_CONFIG_FILE:-./config/btcpay_subscription.yaml}:/app/btcpay_subscription.yaml:ro
    ports:
      - "${HOST_IP:-127.0.0.1}:${HOST_PORT:-8080}:${PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from urllib.request import urlopen; urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8080') + '/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
